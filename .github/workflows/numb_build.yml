name: Numb Build

# Ad-hoc signed build of the fork. Downloadable from the run's Artifacts.
# Compiler errors are re-emitted as annotations so they can be read
# from the commit's check run.
on:
  push:
    branches:
      - 'numb/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: numb-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: |
          set +e
          xcodebuild \
            -project boringNotch.xcodeproj \
            -scheme boringNotch \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            ENABLE_HARDENED_RUNTIME=NO \
            build > build.log 2>&1
          status=$?
          tail -n 40 build.log
          if [ "$status" -ne 0 ]; then
            grep -E '^/.*:[0-9]+:[0-9]+: error: ' build.log | sort -u | head -n 10 | while IFS= read -r line; do
              file=$(echo "$line" | cut -d: -f1 | sed "s#^$GITHUB_WORKSPACE/##")
              row=$(echo "$line" | cut -d: -f2)
              msg=$(echo "$line" | cut -d: -f5-)
              echo "::error file=$file,line=$row::$msg"
            done
            grep -E 'error:|\*\* BUILD FAILED' build.log | grep -vE '^/.*:[0-9]+:[0-9]+: error: ' | sort -u | head -n 5 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"

      - name: Launch check
        run: |
          APP="build/Build/Products/Release/Numbs Boring Notch.app"
          EXE="Contents/MacOS/Numbs Boring Notch"

          launch() {
            "$1/$EXE" > launch.log 2>&1 &
            pid=$!
            sleep 20
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid"; wait "$pid" 2>/dev/null
              return 0
            fi
            wait "$pid"; echo "exit status $?" >> launch.log
            return 1
          }

          report() {
            latest=$(ls -t ~/Library/Logs/DiagnosticReports/*Numbs* 2>/dev/null | head -n 1)
            if [ -n "$latest" ]; then
              python3 -c "import sys,json;t=open(sys.argv[1]).read().split(chr(10),1)[1];d=json.loads(t);print(json.dumps({'termination':d.get('termination'),'asi':d.get('asi')}))" "$latest" | cut -c1-500
            fi
            tail -n 5 launch.log | cut -c1-300
          }

          # Diagnostic only: the same app with the hardened runtime switched on.
          HARD="$RUNNER_TEMP/hardened.app"
          cp -R "$APP" "$HARD"
          codesign --force --options runtime --sign - --preserve-metadata=entitlements "$HARD"
          if launch "$HARD"; then
            echo "::notice::hardened ad-hoc copy launched"
          else
            echo "::notice::hardened ad-hoc copy FAILED: $(report | tr '\n' ' ')"
            rm -f ~/Library/Logs/DiagnosticReports/*Numbs*
          fi

          codesign --verify --deep --strict "$APP" 2>&1 | tail -n 3
          if launch "$APP"; then
            echo "::notice::release app launched and stayed alive"
          else
            echo "::error::release app FAILED to launch: $(report | tr '\n' ' ')"
            exit 1
          fi

      - name: Package
        run: |
          APP="build/Build/Products/Release/Numbs Boring Notch.app"
          ditto -c -k --keepParent "$APP" "Numbs-Boring-Notch.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Numbs-Boring-Notch
          path: Numbs-Boring-Notch.zip
          if-no-files-found: error
          retention-days: 30

      # Runs after the upload so a failing test still leaves a usable build.
      - name: Test
        run: |
          set +e
          xcodebuild \
            -project boringNotch.xcodeproj \
            -scheme boringNotch \
            -configuration Debug \
            -destination "platform=macOS" \
            -derivedDataPath build-test \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            test > test.log 2>&1
          status=$?
          tail -n 25 test.log
          if [ "$status" -ne 0 ]; then
            grep -E '^/.*:[0-9]+(:[0-9]+)?: error: ' test.log | sort -u | head -n 10 | while IFS= read -r line; do
              echo "::error::$(echo "$line" | sed "s#^$GITHUB_WORKSPACE/##" | cut -c1-400)"
            done
          fi
          exit "$status"
