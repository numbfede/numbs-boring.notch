name: Numb Build

# Ad-hoc signed build of the fork. Downloadable from the run's Artifacts.
# Compiler errors are re-emitted as annotations so they can be read
# from the commit's check run.
on:
  push:
    branches:
      - 'numb/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: numb-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Two runner pools, since arm64 capacity can run out. The build is
    # universal, so an artifact from either one works on any supported Mac.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: |
          set +e
          xcodebuild \
            -project boringNotch.xcodeproj \
            -scheme boringNotch \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            ENABLE_HARDENED_RUNTIME=NO \
            build > build.log 2>&1
          status=$?
          tail -n 40 build.log
          if [ "$status" -ne 0 ]; then
            grep -E '^/.*:[0-9]+:[0-9]+: error: ' build.log | sort -u | head -n 10 | while IFS= read -r line; do
              file=$(echo "$line" | cut -d: -f1 | sed "s#^$GITHUB_WORKSPACE/##")
              row=$(echo "$line" | cut -d: -f2)
              msg=$(echo "$line" | cut -d: -f5-)
              echo "::error file=$file,line=$row::$msg"
            done
            grep -E 'error:|\*\* BUILD FAILED' build.log | grep -vE '^/.*:[0-9]+:[0-9]+: error: ' | sort -u | head -n 5 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"

      - name: Launch check
        timeout-minutes: 3
        run: |
          APP="build/Build/Products/Release/Numbs Boring Notch.app"
          EXE="$APP/Contents/MacOS/Numbs Boring Notch"

          # Runners may not enforce library validation, so check the flag itself:
          # with the hardened runtime on, the app does not start on a normal Mac.
          flags=$(codesign -dvv "$APP" 2>&1 | grep -E 'flags=' | head -n 1)
          echo "::notice::signature $flags"
          if echo "$flags" | grep -q runtime; then
            echo "::error::hardened runtime is still on: $flags"
            exit 1
          fi

          "$EXE" > launch.log 2>&1 &
          pid=$!
          sleep 20
          if kill -0 "$pid" 2>/dev/null; then
            kill -9 "$pid" 2>/dev/null
            echo "::notice::app launched and stayed alive"
          else
            echo "::error::app failed to launch: $(tail -n 5 launch.log | tr '\n' ' ' | cut -c1-500)"
            exit 1
          fi

      - name: Package
        run: |
          APP="build/Build/Products/Release/Numbs Boring Notch.app"
          ditto -c -k --keepParent "$APP" "Numbs-Boring-Notch.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Numbs-Boring-Notch-${{ matrix.os }}
          path: Numbs-Boring-Notch.zip
          if-no-files-found: error
          retention-days: 30

      # Runs after the upload so a failing test still leaves a usable build.
      - name: Test
        timeout-minutes: 20
        run: |
          set +e
          xcodebuild \
            -project boringNotch.xcodeproj \
            -scheme boringNotch \
            -configuration Debug \
            -destination "platform=macOS" \
            -derivedDataPath build-test \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            test > test.log 2>&1
          status=$?
          tail -n 25 test.log
          if [ "$status" -ne 0 ]; then
            grep -E '^/.*:[0-9]+(:[0-9]+)?: error: ' test.log | sort -u | head -n 10 | while IFS= read -r line; do
              echo "::error::$(echo "$line" | sed "s#^$GITHUB_WORKSPACE/##" | cut -c1-400)"
            done
            sed -n '/Failing tests:/,/\*\* TEST/p' test.log | head -n 15 | while IFS= read -r line; do
              echo "::error::$(echo "$line" | cut -c1-300)"
            done
            grep -E 'Testing failed|error: |crashed|Could not launch' test.log | grep -vE '^/' | sort -u | head -n 5 | while IFS= read -r line; do
              echo "::error::$(echo "$line" | cut -c1-300)"
            done
          fi
          exit "$status"
